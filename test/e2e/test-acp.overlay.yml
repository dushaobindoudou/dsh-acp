# Test overlay for the e2e run: mounts the deterministic mock LLM provider,
# points the default model at it, and overrides the acp-server row's config
# (proving user-layer config overrides flow through the schema into the wire
# response). Applied with `--patch` over the acp profile; never part of the
# shipped bundle.

- id: agent-default-model
  config:
    provider: mock
    model: mock-1

- id: session-title-llm
  disabled: true

# The tool lifecycle fixture only runs `echo`. DSH's nested confinement
# runner is unavailable on some CI hosts, which otherwise makes the mock
# model retry the same failed tool forever.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: acp-server
  config:
    agentName: dsh-e2e
    offerAlwaysPermissions: false
    token: web-e2e-secret

- insert:
    - id: mock-llm
      name: 'dsh-acp-server/test/mock-llm'
